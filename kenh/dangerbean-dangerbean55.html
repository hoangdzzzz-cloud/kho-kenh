async function decrypt(raw){
  var key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  var all=b64(PAYLOAD),pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:all.slice(0,12)},key,all.slice(12));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();document.title="Xem kênh dangerbean (@dangerbean55)";}
async function derive(pw){
  var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},k,256));
}
function askForm(){
  document.getElementById("wait").hidden=true;var f=document.getElementById("f");f.hidden=false;
  f.onsubmit=async function(e){e.preventDefault();var err=document.getElementById("err");err.textContent="Đang kiểm tra…";
    try{var raw=await derive(document.getElementById("pw").value);var html=await decrypt(raw);

    }catch(_){err.textContent="Sai mật khẩu.";}};
}
(async function(){

})();
