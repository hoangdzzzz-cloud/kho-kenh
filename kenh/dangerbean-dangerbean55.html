<style id="kho_shell_css">

*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}

input,button{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line)}

var unb64=function(a){var s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)};

async function decrypt(raw){
  var key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  var all=b64(PAYLOAD),pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:all.slice(0,12)},key,all.slice(12));
  return new TextDecoder().decode(pt);
}
async function show(html){
  // wait until the shell itself is fully parsed, otherwise document.open() leaves shell leftovers (form, "Đang mở…", grid CSS) in the page
  if(document.readyState!=="complete")await new Promise(function(r){window.addEventListener("load",r,{once:true})});
  await new Promise(function(r){setTimeout(r,0)});
  document.open();document.write(html);document.close();document.title="Xem kênh dangerbean (@dangerbean55)";
  ["kho_shell_css","kho_f","kho_wait"].forEach(function(i){var e=document.getElementById(i);if(e)e.remove()});
}
async function derive(pw){
  var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},k,256));
}
function askForm(){
  document.getElementById("kho_wait").hidden=true;var f=document.getElementById("kho_f");f.hidden=false;
  f.onsubmit=async function(e){e.preventDefault();var err=document.getElementById("kho_err");err.textContent="Đang kiểm tra…";
    try{var raw=await derive(document.getElementById("kho_pw").value);var html=await decrypt(raw);
      try{localStorage.setItem(KEYSTORE,unb64(raw))}catch(_){}await show(html);
    }catch(_){err.textContent="Sai mật khẩu.";}};
}
(async function(){
  if(!window.crypto||!crypto.subtle){document.getElementById("kho_wait").textContent="Trình duyệt này không hỗ trợ mở trang mã hóa (cần https).";return;}
  var saved=null;try{saved=localStorage.getItem(KEYSTORE)}catch(_){}
  if(saved){var h=null;try{h=await decrypt(b64(saved))}catch(_){try{localStorage.removeItem(KEYSTORE)}catch(__){}}
    if(h!==null){await show(h);return}}
  askForm();
})();
})();
